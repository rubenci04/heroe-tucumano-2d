<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0c0e12">
    <title>Héroe Tucumano - 2D Arcade Móvil & Web</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Librería Phaser 3 desde CDN oficial -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <style>
        :root {
            --color-bg: #090c10;
            --color-neon-cyan: #00ffcc;
            --color-neon-orange: #ff5500;
            --color-neon-yellow: #ffd700;
            --color-neon-red: #ff2255;
            --color-neon-purple: #a855f7;
            --arcade-panel-bg: rgba(16, 22, 34, 0.88);
            --btn-size-dpad: 54px;
            --btn-size-action: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: radial-gradient(circle at center, #18202e 0%, #080a0f 100%);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            touch-action: none;
            overscroll-behavior: none;
        }

        #app-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: env(safe-area-inset-top, 6px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 6px) env(safe-area-inset-left, 8px);
        }

        /* BARRA SUPERIOR */
        .arcade-top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            z-index: 50;
            flex-shrink: 0;
        }

        .header-arcade h1 {
            font-size: clamp(0.95rem, 3.2vw, 1.35rem);
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ffcc, #ffd700, #ff5500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 16px rgba(0, 255, 204, 0.4);
            white-space: nowrap;
        }

        .header-badge {
            font-size: 0.65rem;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            margin-left: 6px;
            letter-spacing: 1px;
            display: inline-block;
            vertical-align: middle;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-top-util {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .btn-top-util:active {
            transform: scale(0.94);
            background: rgba(0, 255, 204, 0.25);
            border-color: #00ffcc;
            color: #00ffcc;
        }

        /* ÁREA DEL CANVAS */
        .game-viewport-container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        #contenedor-juego {
            position: relative;
            box-shadow: 0px 0px 24px rgba(0, 255, 204, 0.2), 0px 0px 50px rgba(0, 0, 0, 0.95);
            border: 2px solid #2a374a;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
        }

        #contenedor-juego canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        /* MANDOS TÁCTILES VIRTUALES */
        #arcade-gamepad {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px 10px 14px;
            z-index: 100;
            flex-shrink: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #arcade-gamepad.gamepad-hidden {
            display: none !important;
        }

        /* CRUCETA D-PAD */
        .dpad-container {
            position: relative;
            width: 168px;
            height: 168px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background: radial-gradient(circle, rgba(20, 28, 42, 0.9) 0%, rgba(10, 14, 22, 0.8) 100%);
            padding: 6px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 204, 0.25);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(0, 255, 204, 0.08);
            touch-action: none;
        }

        .touch-btn {
            background: linear-gradient(145deg, #242f3e, #161e2b);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #0d131c, 0 6px 10px rgba(0,0,0,0.5);
            transition: transform 0.06s ease, background 0.06s ease, box-shadow 0.06s ease, border-color 0.06s ease;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .touch-btn .btn-icon {
            font-size: 1.25rem;
            line-height: 1;
            pointer-events: none;
        }

        .touch-btn .btn-sublabel {
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 1px;
            opacity: 0.85;
            pointer-events: none;
        }

        .touch-btn:active,
        .touch-btn.btn-active {
            transform: translateY(3px) scale(0.94);
            box-shadow: 0 1px 0 #0d131c, 0 0 16px rgba(0, 255, 204, 0.6);
            background: linear-gradient(145deg, #00ffcc, #009977);
            color: #06121e;
            border-color: #00ffcc;
        }

        /* Posicionamiento en el grid D-Pad */
        .btn-dpad-up {
            grid-column: 2;
            grid-row: 1;
            border-radius: 12px 12px 4px 4px;
        }
        .btn-dpad-left {
            grid-column: 1;
            grid-row: 2;
            border-radius: 12px 4px 4px 12px;
        }
        .btn-dpad-center {
            grid-column: 2;
            grid-row: 2;
            background: radial-gradient(circle, #1c2635 0%, #101622 100%);
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 255, 204, 0.15);
            pointer-events: none;
        }
        .btn-dpad-right {
            grid-column: 3;
            grid-row: 2;
            border-radius: 4px 12px 12px 4px;
        }
        .btn-dpad-down {
            grid-column: 2;
            grid-row: 3;
            border-radius: 4px 4px 12px 12px;
        }

        /* BOTONES DE ACCIÓN */
        .action-buttons-container {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            touch-action: none;
        }

        .btn-action {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 0 #111, 0 8px 16px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            touch-action: none;
            transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.06s ease;
        }

        .btn-action .btn-icon {
            font-size: 1.35rem;
            line-height: 1;
            pointer-events: none;
        }

        .btn-action .btn-text {
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.6px;
            margin-top: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* Botón Salto */
        .btn-action-jump {
            background: radial-gradient(circle at 35% 35%, #00ffcc 0%, #008866 100%);
            color: #031418;
            border-color: #55ffe0;
            box-shadow: 0 5px 0 #004d3d, 0 8px 16px rgba(0, 255, 204, 0.35);
        }
        .btn-action-jump:active,
        .btn-action-jump.btn-active {
            transform: translateY(4px) scale(0.93);
            box-shadow: 0 1px 0 #004d3d, 0 0 24px rgba(0, 255, 204, 0.9);
            filter: brightness(1.2);
        }

        /* Botón Disparo */
        .btn-action-fire {
            background: radial-gradient(circle at 35% 35%, #ff5500 0%, #aa2200 100%);
            color: #fff;
            border-color: #ff9955;
            box-shadow: 0 5px 0 #661100, 0 8px 16px rgba(255, 85, 0, 0.4);
        }
        .btn-action-fire:active,
        .btn-action-fire.btn-active {
            transform: translateY(4px) scale(0.93);
            box-shadow: 0 1px 0 #661100, 0 0 24px rgba(255, 85, 0, 0.9);
            filter: brightness(1.2);
        }

        /* Botón Cabezazo Especial */
        .btn-action-headbutt {
            background: radial-gradient(circle at 35% 35%, #ffd700 0%, #b8860b 100%);
            color: #1a1200;
            border-color: #fff066;
            box-shadow: 0 5px 0 #6b4f00, 0 8px 16px rgba(255, 215, 0, 0.35);
            width: 62px;
            height: 62px;
            position: relative;
        }
        .btn-action-headbutt:active,
        .btn-action-headbutt.btn-active {
            transform: translateY(4px) scale(0.93);
            box-shadow: 0 1px 0 #6b4f00, 0 0 24px rgba(255, 215, 0, 0.9);
            filter: brightness(1.25);
        }

        /* Animación cuando se activa la Furia de la Milanesa */
        .btn-action-headbutt.sanguchazo-activo {
            animation: pulse-milanga 0.7s infinite alternate ease-in-out;
            border-color: #fff;
        }

        @keyframes pulse-milanga {
            0% {
                box-shadow: 0 0 10px #ffd700, 0 0 25px rgba(255, 85, 0, 0.6);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 25px #ffd700, 0 0 45px rgba(255, 215, 0, 0.9);
                transform: scale(1.12);
            }
        }

        /* GUÍA DE TECLAS / DESKTOP COLLAPSIBLE */
        .controles-guia {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: rgba(15, 20, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: #94a3b8;
            margin-bottom: 2px;
            z-index: 40;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tecla {
            display: inline-block;
            background: #252e3d;
            color: #00ffcc;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid #3e4c63;
            font-size: 0.68rem;
        }

        /* RESPONSIVIDAD Y ADAPTACIÓN EN MÓVILES (LANDSCAPE VS PORTRAIT) */
        
        /* MODO HORIZONTAL (LANDSCAPE) EN MÓVILES */
        @media (orientation: landscape) and (max-height: 520px) {
            #app-root {
                padding: 2px 6px;
                justify-content: center;
            }

            .arcade-top-bar {
                position: absolute;
                top: 4px;
                left: 12px;
                right: 12px;
                width: auto;
                max-width: none;
                pointer-events: none;
                background: transparent;
                padding: 0;
            }

            .header-arcade h1 {
                font-size: 0.85rem;
                background: rgba(0,0,0,0.5);
                padding: 2px 8px;
                border-radius: 6px;
            }

            .top-actions {
                pointer-events: auto;
            }

            .controles-guia {
                display: none;
            }

            .game-viewport-container {
                width: 100%;
                height: 100%;
                max-width: none;
            }

            #contenedor-juego {
                height: 100%;
                max-height: 100dvh;
                border-radius: 4px;
            }

            /* Los controles flotan en los laterales sobre el borde */
            #arcade-gamepad {
                position: absolute;
                bottom: 6px;
                left: 0;
                right: 0;
                max-width: none;
                padding: 0 14px;
                pointer-events: none;
            }

            .dpad-container, .action-buttons-container {
                pointer-events: auto;
                opacity: 0.85;
            }

            .dpad-container {
                width: 138px;
                height: 138px;
            }

            .btn-action {
                width: 60px;
                height: 60px;
            }

            .btn-action-headbutt {
                width: 52px;
                height: 52px;
            }
        }

        /* MODO VERTICAL (PORTRAIT) EN MÓVILES */
        @media (orientation: portrait) {
            .game-viewport-container {
                max-height: 48vh;
            }

            #arcade-gamepad {
                padding: 6px 10px 14px 10px;
            }

            .dpad-container {
                width: 152px;
                height: 152px;
            }

            .btn-action {
                width: 64px;
                height: 64px;
            }

            .btn-action-headbutt {
                width: 54px;
                height: 54px;
            }
        }

        @media (max-width: 380px) {
            .dpad-container {
                width: 130px;
                height: 130px;
            }
            .btn-action {
                width: 56px;
                height: 56px;
                gap: 6px;
            }
            .action-buttons-container {
                gap: 6px;
            }
        }
    </style>
</head>

<body>
    <div id="app-root">
        <!-- BARRA SUPERIOR -->
        <header class="arcade-top-bar">
            <div class="header-arcade">
                <h1>Héroe Tucumano <span class="header-badge">RUTA 38</span></h1>
            </div>

            <div class="top-actions">
                <button id="btn-toggle-controls" class="btn-top-util" title="Ocultar/Mostrar Controles">
                    <span>🎮</span> <span class="btn-label-txt">Mandos</span>
                </button>
                <button id="btn-fullscreen" class="btn-top-util" title="Pantalla Completa">
                    <span>⛶</span> <span class="btn-label-txt">Full</span>
                </button>
            </div>
        </header>

        <!-- ÁREA DEL JUEGO -->
        <main class="game-viewport-container">
            <div id="contenedor-juego"></div>
        </main>

        <!-- MANDOS TÁCTILES VIRTUALES -->
        <section id="arcade-gamepad" aria-label="Controles táctiles arcade">
            <!-- D-PAD / CRUCETA -->
            <div class="dpad-container" id="dpad-panel">
                <button class="touch-btn btn-dpad-up" data-action="up" aria-label="Subir carril">
                    <span class="btn-icon">▲</span>
                    <span class="btn-sublabel">SUBIR</span>
                </button>
                <button class="touch-btn btn-dpad-left" data-action="left" aria-label="Mover izquierda">
                    <span class="btn-icon">◀</span>
                    <span class="btn-sublabel">IZQ</span>
                </button>
                <div class="btn-dpad-center"></div>
                <button class="touch-btn btn-dpad-right" data-action="right" aria-label="Mover derecha">
                    <span class="btn-icon">▶</span>
                    <span class="btn-sublabel">DER</span>
                </button>
                <button class="touch-btn btn-dpad-down" data-action="down" aria-label="Bajar carril">
                    <span class="btn-icon">▼</span>
                    <span class="btn-sublabel">BAJAR</span>
                </button>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="action-buttons-container" id="actions-panel">
                <!-- CABEZAZO (C) -->
                <button class="btn-action btn-action-headbutt" data-action="cabezazo" id="btn-touch-cabezazo" aria-label="Cabezazo con Milanesa">
                    <span class="btn-icon">⚡</span>
                    <span class="btn-text">GOLPE</span>
                </button>

                <!-- DISPARO (Z/X) -->
                <button class="btn-action btn-action-fire" data-action="disparo" id="btn-touch-disparo" aria-label="Disparar Naranjas o Cascotes">
                    <span class="btn-icon">🍊</span>
                    <span class="btn-text">DISPARO</span>
                </button>

                <!-- SALTO (ESPACIO) -->
                <button class="btn-action btn-action-jump" data-action="salto" id="btn-touch-salto" aria-label="Saltar">
                    <span class="btn-icon">🚀</span>
                    <span class="btn-text">SALTO</span>
                </button>
            </div>
        </section>

        <!-- GUÍA DE TECLADO (DESKTOP) -->
        <footer class="controles-guia">
            <div class="control-item"><span class="tecla">←</span> <span class="tecla">→</span> Moverse</div>
            <div class="control-item"><span class="tecla">↑</span> <span class="tecla">↓</span> Carril</div>
            <div class="control-item"><span class="tecla">ESPACIO</span> Saltar</div>
            <div class="control-item"><span class="tecla">Z</span> / <span class="tecla">X</span> Disparar</div>
            <div class="control-item"><span class="tecla">C</span> Cabezazo</div>
        </footer>
    </div>

    <!-- SCRIPT DEL JUEGO -->
    <script src="main.js"></script>

    <!-- MOTOR DE EVENTOS MULTI-TOUCH Y UTILIDADES MÓVILES -->
    <script>
        (function initTouchController() {
            const gamepad = document.getElementById('arcade-gamepad');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const btnToggleControls = document.getElementById('btn-toggle-controls');
            const btnCabezazo = document.getElementById('btn-touch-cabezazo');

            // Mapa para rastrear los toques activos en cada botón
            // touchId -> actionName
            const touchMap = new Map();
            // actionName -> Set of touchIds
            const activeActions = {
                left: new Set(),
                right: new Set(),
                up: new Set(),
                down: new Set(),
                salto: new Set(),
                disparo: new Set(),
                cabezazo: new Set()
            };

            const allButtons = document.querySelectorAll('#arcade-gamepad [data-action]');

            function setActionState(action, isPressed, touchId) {
                if (!window.ControlesTactiles || !activeActions.hasOwnProperty(action)) return;

                if (isPressed) {
                    activeActions[action].add(touchId);
                } else {
                    activeActions[action].delete(touchId);
                }

                const isActive = activeActions[action].size > 0;
                window.ControlesTactiles.setButton(action, isActive);

                // Actualizar estilo visual activo
                allButtons.forEach(btn => {
                    if (btn.getAttribute('data-action') === action) {
                        if (isActive) btn.classList.add('btn-active');
                        else btn.classList.remove('btn-active');
                    }
                });
            }

            function getButtonFromElement(el) {
                if (!el) return null;
                return el.closest('[data-action]');
            }

            // GESTIÓN MULTI-TOUCH
            document.addEventListener('touchstart', (e) => {
                // Iniciar Audio en el primer toque si aún no se inició
                if (window.AudioSFX && typeof window.AudioSFX.init === 'function') {
                    window.AudioSFX.init();
                }

                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                    const btn = getButtonFromElement(targetEl);

                    if (btn && gamepad.contains(btn)) {
                        e.preventDefault();
                        const action = btn.getAttribute('data-action');
                        touchMap.set(touch.identifier, action);
                        setActionState(action, true, touch.identifier);
                    }
                }
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const prevAction = touchMap.get(touch.identifier);
                    const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                    const btn = getButtonFromElement(targetEl);
                    const currentAction = (btn && gamepad.contains(btn)) ? btn.getAttribute('data-action') : null;

                    if (prevAction !== currentAction) {
                        e.preventDefault();
                        if (prevAction) {
                            setActionState(prevAction, false, touch.identifier);
                            touchMap.delete(touch.identifier);
                        }
                        if (currentAction) {
                            touchMap.set(touch.identifier, currentAction);
                            setActionState(currentAction, true, touch.identifier);
                        }
                    }
                }
            }, { passive: false });

            function handleTouchEnd(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const action = touchMap.get(touch.identifier);
                    if (action) {
                        e.preventDefault();
                        setActionState(action, false, touch.identifier);
                        touchMap.delete(touch.identifier);
                    }
                }
            }

            document.addEventListener('touchend', handleTouchEnd, { passive: false });
            document.addEventListener('touchcancel', handleTouchEnd, { passive: false });

            // SOPORTE PARA MOUSE EN DESKTOP
            allButtons.forEach(btn => {
                const action = btn.getAttribute('data-action');

                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    if (window.AudioSFX && typeof window.AudioSFX.init === 'function') {
                        window.AudioSFX.init();
                    }
                    setActionState(action, true, 'mouse');
                });

                btn.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    setActionState(action, false, 'mouse');
                });

                btn.addEventListener('mouseleave', (e) => {
                    setActionState(action, false, 'mouse');
                });
            });

            // PANTALLA COMPLETA
            if (btnFullscreen) {
                btnFullscreen.addEventListener('click', () => {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        const docEl = document.documentElement;
                        if (docEl.requestFullscreen) {
                            docEl.requestFullscreen().catch(() => {});
                        } else if (docEl.webkitRequestFullscreen) {
                            docEl.webkitRequestFullscreen();
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen().catch(() => {});
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                    }
                });
            }

            // TOGGLE MOSTRAR/OCULTAR CONTROLES
            if (btnToggleControls) {
                btnToggleControls.addEventListener('click', () => {
                    gamepad.classList.toggle('gamepad-hidden');
                });
            }

            // FEEDBACK VISUAL PARA MODO SANGUCHAZO
            window.addEventListener('modo-sanguchazo', (e) => {
                if (!btnCabezazo) return;
                if (e.detail && e.detail.activo) {
                    btnCabezazo.classList.add('sanguchazo-activo');
                } else {
                    btnCabezazo.classList.remove('sanguchazo-activo');
                }
            });

            // AUTO-DETECCIÓN DE PANTALLA TÁCTIL O MÓVIL
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (!isTouchDevice && window.innerWidth > 900) {
                // En pantallas desktop muy amplias, se pueden mantener visibles o accesibles
            }
        })();
    </script>
