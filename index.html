<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Héroe Tucumano - 2D Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Librería Phaser 3 desde CDN oficial -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(circle at center, #1b2028 0%, #0c0e12 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }

        .header-arcade {
            text-align: center;
            margin-bottom: 8px;
        }

        .header-arcade h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ffcc, #ffd700, #ff5500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        #contenedor-juego {
            position: relative;
            box-shadow: 0px 0px 30px rgba(0, 255, 204, 0.2), 0px 0px 60px rgba(0, 0, 0, 0.9);
            border: 3px solid #2a3342;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            max-width: 100%;
        }

        #contenedor-juego canvas {
            display: block;
        }

        .controles-guia {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            background: rgba(20, 25, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tecla {
            display: inline-block;
            background: #2b3545;
            color: #00ffcc;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid #475569;
            box-shadow: 0 2px 0 #1e293b;
            font-size: 0.78rem;
        }
    </style>
</head>

<body>
    <div class="header-arcade">
        <h1>Héroe Tucumano - Ruta 38 Arcade</h1>
    </div>

    <div id="contenedor-juego"></div>

    <div class="controles-guia">
        <div class="control-item"><span class="tecla">←</span> <span class="tecla">→</span> Moverse</div>
        <div class="control-item"><span class="tecla">↑</span> <span class="tecla">↓</span> Cambiar Carril</div>
        <div class="control-item"><span class="tecla">ESPACIO</span> Saltar</div>
        <div class="control-item"><span class="tecla">Z</span> / <span class="tecla">X</span> Disparar / Avanzar Diálogo</div>
    </div>

    <script src="main.js"></script>
</body>

</html>
